[package]
name = "sa-drive"
version = "0.1.0"
description = "Mini Drive quản lý nhiều Google service account"
edition = "2021"
rust-version = "1.90"

[lib]
name = "sa_drive_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"

# TLS dùng rustls + ring (cùng backend với jsonwebtoken) để tránh aws-lc-sys,
# thứ đòi hỏi CMake/NASM khi build trên Windows.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider", "http2", "charset", "json", "stream", "form", "query", "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

jsonwebtoken = "9"
aes-gcm = "0.10"
base64 = "0.22"
# Phải bật rõ các backend, nếu không keyring rơi về mock store và không lưu gì cả.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

mime_guess = "2"
walkdir = "2"

[features]
# Bản production nạp giao diện từ ../dist qua giao thức nội bộ thay vì dev server.
# `tauri build` tự bật; để sẵn đây cho trường hợp chạy `cargo build --release` trực tiếp.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
